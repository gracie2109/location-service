name: Weekly backup

# Sunday 03:00 Vietnam time (Saturday 20:00 UTC), or run by hand.
on:
  schedule:
    - cron: "0 20 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets DATABASE_URL and BACKUP_PASSPHRASE must both be set (see docs/trien-khai.md)."
            exit 1
          fi

      - name: Install a pg_dump that matches Neon (17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17

      - name: Dump and encrypt the location schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          file="location-$(date -u +%Y%m%d).dump.gpg"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --schema=location --no-owner --no-privileges "$DATABASE_URL" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" --output "$file"
          ls -l "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: location-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
